# Единственное место, где живёт конфигурация препроцессинга.
# Правится ЗДЕСЬ, а не в коде: в src/ не должно быть ни имени модели,
# ни длин, ни порогов.
model:
  name: "Qwen/Qwen3-0.6B"
  # Qwen3 без этого флага ждёт от модели <think>-блок, и тогда шаблон
  # инференса перестаёт быть префиксом шаблона обучения. См. docs/tokenize_report.md.
  enable_thinking: false

data:
  # Датасет курса (CC-BY-4.0), лежит вне проекта — под DVC, не в git.
  source_train: "../../datasets/nmo/sft_single/train/0000.parquet"
  source_val: "../../datasets/nmo/sft_single/validation/0000.parquet"
  train_jsonl: "data/train.jsonl"
  val_jsonl: "data/val.jsonl"
  out_dir: "data/tokenized"

sample:
  train_size: 500
  val_size: 100
  scan_rows: 20000          # сколько строк parquet просматриваем перед выборкой
  seed: 42

tokenize:
  # По хвосту распределения своего датасета (ДЗ 3, v2), а не курсового среза:
  # train p50/p90/p95/p99/max = 216/486/595/715/864 токенов. 232 резал 45.4%
  # train, и у 793 из 854 обрезанных пропадал весь ответ — ответ здесь в конце
  # и короткий (13–14 токенов), так что любая обрезка бьёт именно по нему.
  # 768 — первое «круглое» значение выше p99: обрезано 8 из 1882 (0.4%).
  # Паддинг динамический, так что max_seq_len — потолок хвоста, а не ширина батча.
  max_seq_len: 768
  truncated_warn_ratio: 0.05
  padding_side: "left"

packing:
  enabled: true
  batch_size: 8             # для пересчёта выигрыша в шагах оптимизатора

train_estimate:
  epochs: 3
  # 67 ток/с — скорость генерации Qwen3-0.6B на машине, где будет ДЗ 5
  # (RTX 4060). Для сравнения: прогон кода ДЗ 1 на этом же ПК при загруженном
  # CPU (i5-6500, 4 ядра) дал 8.14 ток/с — генерация с batch 1 упиралась в CPU,
  # а не в GPU. Обучение медленнее: forward + backward + optimizer. Реальное
  # число подставляется сюда после первого прогона ДЗ 5.
  tokens_per_sec: 67
