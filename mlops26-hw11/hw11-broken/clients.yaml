{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "client-0",
    "namespace": "hw11",
    "labels": {
      "app": "hw11-client"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "client",
        "image": "mlops-hw11:dev3",
        "imagePullPolicy": "IfNotPresent",
        "command": [
          "/app/.venv/bin/python",
          "-c",
          "import time; time.sleep(604800)"
        ],
        "resources": {
          "requests": {
            "cpu": "50m",
            "memory": "64Mi"
          },
          "limits": {
            "cpu": "300m",
            "memory": "192Mi"
          }
        }
      }
    ]
  }
}
