{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "name": "hw11"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "monitor",
    "namespace": "hw11"
  }
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRole",
  "metadata": {
    "name": "hw11-monitor"
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "nodes",
        "nodes/proxy",
        "pods",
        "services",
        "endpoints",
        "namespaces"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "apps"
      ],
      "resources": [
        "deployments",
        "replicasets",
        "statefulsets",
        "daemonsets"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "autoscaling"
      ],
      "resources": [
        "horizontalpodautoscalers"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRoleBinding",
  "metadata": {
    "name": "hw11-monitor"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "ClusterRole",
    "name": "hw11-monitor"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "monitor",
      "namespace": "hw11"
    }
  ]
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "prometheus",
    "namespace": "hw11"
  },
  "data": {
    "prometheus.yml": "{\"global\":{\"scrape_interval\":\"5s\",\"evaluation_interval\":\"5s\"},\"rule_files\":[\"/etc/prometheus/alerts.yaml\"],\"scrape_configs\":[{\"job_name\":\"api\",\"kubernetes_sd_configs\":[{\"role\":\"pod\",\"namespaces\":{\"names\":[\"hw11\"]}}],\"relabel_configs\":[{\"source_labels\":[\"__meta_kubernetes_pod_label_app\"],\"regex\":\"hw11-api\",\"action\":\"keep\"},{\"source_labels\":[\"__meta_kubernetes_pod_container_port_name\"],\"regex\":\"http\",\"action\":\"keep\"},{\"source_labels\":[\"__meta_kubernetes_pod_name\"],\"target_label\":\"pod\"}]},{\"job_name\":\"kube-state\",\"static_configs\":[{\"targets\":[\"kube-state:8080\"]}]},{\"job_name\":\"kubelet\",\"scheme\":\"https\",\"tls_config\":{\"insecure_skip_verify\":true},\"bearer_token_file\":\"/var/run/secrets/kubernetes.io/serviceaccount/token\",\"kubernetes_sd_configs\":[{\"role\":\"node\"}],\"relabel_configs\":[{\"target_label\":\"__address__\",\"replacement\":\"kubernetes.default.svc:443\"},{\"source_labels\":[\"__meta_kubernetes_node_name\"],\"target_label\":\"__metrics_path__\",\"replacement\":\"/api/v1/nodes/$1/proxy/metrics/cadvisor\"}]}]}",
    "alerts.yaml": "{\"groups\":[{\"name\":\"hw11\",\"rules\":[{\"alert\":\"HighTTFC\",\"expr\":\"histogram_quantile(0.95, sum by(le) (rate(hw11_ttfc_seconds_bucket[30s]))) > 1.5 and sum(increase(hw11_ttfc_seconds_count[30s])) >= 10\",\"for\":\"15s\",\"labels\":{\"severity\":\"warning\"},\"annotations\":{\"summary\":\"TTFC p95 > 1.5 s with at least 10 completed observations\"}},{\"alert\":\"HighRejections\",\"expr\":\"sum(rate(hw11_requests_total{outcome=\\\"rejected\\\"}[30s])) / sum(rate(hw11_requests_total[30s])) > 0.1 and sum(increase(hw11_requests_total[30s])) >= 10\",\"for\":\"15s\",\"labels\":{\"severity\":\"warning\"},\"annotations\":{\"summary\":\"Rejections > 10%, at least 10 terminal observations\"}}]}]}"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "prometheus",
    "namespace": "hw11"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "prometheus"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "prometheus"
        }
      },
      "spec": {
        "serviceAccountName": "monitor",
        "containers": [
          {
            "name": "prometheus",
            "image": "prom/prometheus:v3.5.0",
            "args": [
              "--config.file=/etc/prometheus/prometheus.yml",
              "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=6h",
              "--storage.tsdb.retention.size=256MB"
            ],
            "env": [],
            "ports": [
              {
                "containerPort": 9090,
                "name": "http"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "384Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/etc/prometheus"
              },
              {
                "name": "data",
                "mountPath": "/prometheus"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "prometheus"
            }
          },
          {
            "name": "data",
            "emptyDir": {
              "sizeLimit": "512Mi"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "prometheus",
    "namespace": "hw11"
  },
  "spec": {
    "selector": {
      "app": "prometheus"
    },
    "ports": [
      {
        "port": 9090,
        "targetPort": 9090
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "kube-state",
    "namespace": "hw11"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "kube-state"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "kube-state"
        }
      },
      "spec": {
        "serviceAccountName": "monitor",
        "containers": [
          {
            "name": "kube-state",
            "image": "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0",
            "args": [
              "--resources=pods,deployments,horizontalpodautoscalers",
              "--namespaces=hw11"
            ],
            "env": [],
            "ports": [
              {
                "containerPort": 8080,
                "name": "http"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "128Mi"
              }
            },
            "volumeMounts": []
          }
        ],
        "volumes": []
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "kube-state",
    "namespace": "hw11"
  },
  "spec": {
    "selector": {
      "app": "kube-state"
    },
    "ports": [
      {
        "port": 8080,
        "targetPort": 8080
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "grafana",
    "namespace": "hw11"
  },
  "data": {
    "datasource.yaml": "{\"apiVersion\":1,\"datasources\":[{\"name\":\"Prometheus\",\"uid\":\"prometheus\",\"type\":\"prometheus\",\"access\":\"proxy\",\"url\":\"http://prometheus:9090\",\"isDefault\":true}]}",
    "provider.yaml": "{\"apiVersion\":1,\"providers\":[{\"name\":\"hw11\",\"type\":\"file\",\"options\":{\"path\":\"/dashboards\"}}]}",
    "dashboard.json": "{\"uid\":\"hw11\",\"title\":\"HW11 simulated CPU service\",\"schemaVersion\":39,\"version\":1,\"refresh\":\"5s\",\"time\":{\"from\":\"now-30m\",\"to\":\"now\"},\"panels\":[{\"id\":1,\"type\":\"timeseries\",\"title\":\"TTFC p95 by Pod (s)\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"prometheus\"},\"gridPos\":{\"x\":0,\"y\":0,\"w\":12,\"h\":8},\"fieldConfig\":{\"defaults\":{\"unit\":\"s\"},\"overrides\":[]},\"targets\":[{\"refId\":\"A\",\"expr\":\"histogram_quantile(0.95,sum by(le,pod)(rate(hw11_ttfc_seconds_bucket[1m])))\",\"legendFormat\":\"{{pod}} {{outcome}}\"}]},{\"id\":2,\"type\":\"timeseries\",\"title\":\"Full response p95 (s)\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"prometheus\"},\"gridPos\":{\"x\":12,\"y\":0,\"w\":12,\"h\":8},\"fieldConfig\":{\"defaults\":{\"unit\":\"s\"},\"overrides\":[]},\"targets\":[{\"refId\":\"A\",\"expr\":\"histogram_quantile(0.95,sum by(le,pod)(rate(hw11_duration_seconds_bucket[1m])))\",\"legendFormat\":\"{{pod}} {{outcome}}\"}]},{\"id\":3,\"type\":\"timeseries\",\"title\":\"Running / waiting\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"prometheus\"},\"gridPos\":{\"x\":0,\"y\":8,\"w\":12,\"h\":8},\"fieldConfig\":{\"defaults\":{\"unit\":\"short\"},\"overrides\":[]},\"targets\":[{\"refId\":\"A\",\"expr\":\"hw11_running or hw11_waiting\",\"legendFormat\":\"{{pod}} {{outcome}}\"}]},{\"id\":4,\"type\":\"timeseries\",\"title\":\"Completed requests/s\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"prometheus\"},\"gridPos\":{\"x\":12,\"y\":8,\"w\":12,\"h\":8},\"fieldConfig\":{\"defaults\":{\"unit\":\"reqps\"},\"overrides\":[]},\"targets\":[{\"refId\":\"A\",\"expr\":\"sum by(pod)(rate(hw11_requests_total{outcome=\\\"completed\\\"}[1m]))\",\"legendFormat\":\"{{pod}} {{outcome}}\"}]},{\"id\":5,\"type\":\"timeseries\",\"title\":\"Rejected / aborted requests/s\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"prometheus\"},\"gridPos\":{\"x\":0,\"y\":16,\"w\":12,\"h\":8},\"fieldConfig\":{\"defaults\":{\"unit\":\"reqps\"},\"overrides\":[]},\"targets\":[{\"refId\":\"A\",\"expr\":\"sum by(pod,outcome)(rate(hw11_requests_total{outcome!=\\\"completed\\\"}[1m]))\",\"legendFormat\":\"{{pod}} {{outcome}}\"}]},{\"id\":6,\"type\":\"timeseries\",\"title\":\"API CPU cores\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"prometheus\"},\"gridPos\":{\"x\":12,\"y\":16,\"w\":12,\"h\":8},\"fieldConfig\":{\"defaults\":{\"unit\":\"short\"},\"overrides\":[]},\"targets\":[{\"refId\":\"A\",\"expr\":\"sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\\\"hw11\\\",container=\\\"api\\\"}[1m]))\",\"legendFormat\":\"{{pod}} {{outcome}}\"}]},{\"id\":7,\"type\":\"timeseries\",\"title\":\"API working set RAM\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"prometheus\"},\"gridPos\":{\"x\":0,\"y\":24,\"w\":12,\"h\":8},\"fieldConfig\":{\"defaults\":{\"unit\":\"bytes\"},\"overrides\":[]},\"targets\":[{\"refId\":\"A\",\"expr\":\"sum by(pod)(container_memory_working_set_bytes{namespace=\\\"hw11\\\",container=\\\"api\\\"})\",\"legendFormat\":\"{{pod}} {{outcome}}\"}]},{\"id\":8,\"type\":\"timeseries\",\"title\":\"Ready replicas\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"prometheus\"},\"gridPos\":{\"x\":12,\"y\":24,\"w\":12,\"h\":8},\"fieldConfig\":{\"defaults\":{\"unit\":\"short\"},\"overrides\":[]},\"targets\":[{\"refId\":\"A\",\"expr\":\"sum(kube_pod_status_ready{namespace=\\\"hw11\\\",condition=\\\"true\\\",pod=~\\\"hw11-api.*\\\"})\",\"legendFormat\":\"{{pod}} {{outcome}}\"}]}]}"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "grafana",
    "namespace": "hw11"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "grafana"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "grafana"
        }
      },
      "spec": {
        "serviceAccountName": "monitor",
        "containers": [
          {
            "name": "grafana",
            "image": "grafana/grafana:12.1.1",
            "args": [],
            "env": [
              {
                "name": "GF_AUTH_ANONYMOUS_ENABLED",
                "value": "true"
              },
              {
                "name": "GF_AUTH_ANONYMOUS_ORG_ROLE",
                "value": "Viewer"
              },
              {
                "name": "GF_ANALYTICS_REPORTING_ENABLED",
                "value": "false"
              }
            ],
            "ports": [
              {
                "containerPort": 3000,
                "name": "http"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/etc/grafana/provisioning/datasources/datasource.yaml",
                "subPath": "datasource.yaml"
              },
              {
                "name": "config",
                "mountPath": "/etc/grafana/provisioning/dashboards/provider.yaml",
                "subPath": "provider.yaml"
              },
              {
                "name": "config",
                "mountPath": "/dashboards/dashboard.json",
                "subPath": "dashboard.json"
              },
              {
                "name": "data",
                "mountPath": "/var/lib/grafana"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "grafana"
            }
          },
          {
            "name": "data",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "grafana",
    "namespace": "hw11"
  },
  "spec": {
    "selector": {
      "app": "grafana"
    },
    "ports": [
      {
        "port": 3000,
        "targetPort": 3000
      }
    ]
  }
}
