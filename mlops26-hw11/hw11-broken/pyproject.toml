[project]
name = "mlops-hw11"
version = "0.1.0"
description = "Kubernetes experiments with a controlled CPU streaming backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.14",
  "uvicorn==0.54.0",
  "pyyaml==6.0.3",
  "prometheus-client==0.26.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["ruff==0.17.3", "matplotlib==3.11.2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
