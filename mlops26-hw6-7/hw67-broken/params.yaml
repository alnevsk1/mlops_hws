# Один бюджет и один val для всех шести кандидатов. Это короткий учебный поиск.
model:
  name: Qwen/Qwen3-0.6B
  revision: main   # run сохраняет разрешённый commit HF, а не только main
  device: auto
  dtype: bfloat16
  enable_thinking: false
data:
  train: data/tokenized/train.pt
  val: data/tokenized/val.pt
train:
  seed: 42
  max_steps: 4
  train_limit: 32
  val_limit: 8
  batch_size: 1
  grad_accum: 2
  eval_every: 2
  gradient_checkpointing: true
lora:
  dropout: 0.05
  alpha_over_r: 2
sweep:
  - {name: qv-r4-low, r: 4, lr: 0.0001, target_modules: [q_proj, v_proj]}
  - {name: qv-r4-high, r: 4, lr: 0.0003, target_modules: [q_proj, v_proj]}
  - {name: qv-r8-low, r: 8, lr: 0.0001, target_modules: [q_proj, v_proj]}
  - {name: qv-r8-high, r: 8, lr: 0.0003, target_modules: [q_proj, v_proj]}
  - {name: all-r8-low, r: 8, lr: 0.0001, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  - {name: all-r8-high, r: 8, lr: 0.0003, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
tracking:
  uri: http://127.0.0.1:5006
  experiment: hw6-lora
registry:
  name: my-qwen-adapter
  alias: champion
  # Порог относительный к базе на ТОМ ЖЕ val; меньше loss — лучше.
  max_val_ratio: 1.0
generation:
  # Ответ обучения {"type": ..., "breaking": ...} — 13-14 токенов (ДЗ 4); запас на обёртку базы.
  max_new_tokens: 24
  # Один из пяти system-промптов обучения (ДЗ 3), английский: ответ остаётся ASCII.
  system: "You classify git commits by Conventional Commits type. Given the commit message (prefix removed) and the list of changed files, answer with a JSON object: {\"type\": one of feat|fix|docs|refactor|test|chore, \"breaking\": true or false}. Answer with JSON only."
  # Два коммита из val (vuejs/core), не из test: test не участвует в выборе.
  prompts:
    - "reject CR in attribute names (#15266)\n\nChanged files (2):\n- packages/server-renderer/__tests__/ssrRenderAttrs.spec.ts | modified | +11 -0\n- packages/shared/src/domAttrConfig.ts | modified | +1 -1"
    - "add expect warn\n\nChanged files (1):\n- packages/server-renderer/__tests__/ssrRender.spec.ts | modified | +6 -0"
# Сборка golden/behavioral/training-index (часть B, scripts/build_eval_sets.py, стадия eval_sets).
eval_sets:
  source_train: data/source/train.jsonl   # train ДЗ 3 v2 = вход tokenize ДЗ 4
  source_test: data/source/test.jsonl     # test ДЗ 3 v2: nestjs/nest, в обучение не попадал
  tokenized_train: data/tokenized/train.pt
  review: evaluation/review/golden-review.csv
  behavioral: evaluation/review/behavioral.jsonl
  out_dir: data/eval
  seed: 42
  # Стратифицированно: редкие типы — все прошедшие ручной разбор, fix — частично.
  per_type: {feat: 9, fix: 12, docs: 8, refactor: 8, test: 10, chore: 10}
  choices: [feat, fix, docs, refactor, test, chore, REFUSE]
